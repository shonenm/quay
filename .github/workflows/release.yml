# Release workflow
# Triggered by pushing a version tag (e.g., v1.0.0)
# Builds binaries for 4 targets, creates GitHub Release, publishes to crates.io, updates Homebrew tap

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Build for macOS (Intel)
  build-x86_64-apple-darwin:
    needs: plan
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/quay dist/
          cd dist && tar -czvf quay-${{ needs.plan.outputs.version }}-x86_64-apple-darwin.tar.gz quay
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-x86_64-apple-darwin
          path: dist/*.tar.gz

  # Build for macOS (Apple Silicon)
  build-aarch64-apple-darwin:
    needs: plan
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/quay dist/
          cd dist && tar -czvf quay-${{ needs.plan.outputs.version }}-aarch64-apple-darwin.tar.gz quay
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-aarch64-apple-darwin
          path: dist/*.tar.gz

  # Build for Linux (x86_64, musl static)
  build-x86_64-unknown-linux-musl:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/quay dist/
          cd dist && tar -czvf quay-${{ needs.plan.outputs.version }}-x86_64-unknown-linux-musl.tar.gz quay
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-x86_64-unknown-linux-musl
          path: dist/*.tar.gz

  # Build for Linux (aarch64, musl static)
  build-aarch64-unknown-linux-musl:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          mkdir -p .cargo
          cat >> .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/quay dist/
          cd dist && tar -czvf quay-${{ needs.plan.outputs.version }}-aarch64-unknown-linux-musl.tar.gz quay
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-aarch64-unknown-linux-musl
          path: dist/*.tar.gz

  # Create GitHub Release with all artifacts
  release:
    needs:
      - plan
      - build-x86_64-apple-darwin
      - build-aarch64-apple-darwin
      - build-x86_64-unknown-linux-musl
      - build-aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums-sha256.txt
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          # Extract section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            BODY=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$ d')
            if [ -z "$BODY" ]; then
              BODY="Release v${VERSION}"
            fi
          else
            BODY="Release v${VERSION}"
          fi
          # Write to file to avoid escaping issues
          echo "$BODY" > release_body.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums-sha256.txt
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io
  publish-crates-io:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Update Homebrew tap
  publish-homebrew:
    needs:
      - plan
      - release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: shonenm/homebrew-quay
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Generate Homebrew formula
        run: |
          VERSION="${{ needs.plan.outputs.version }}"
          TAG="${{ needs.plan.outputs.tag }}"
          BASE_URL="https://github.com/shonenm/quay/releases/download/${TAG}"

          # Download checksums
          curl -sL "${BASE_URL}/checksums-sha256.txt" -o checksums.txt

          # Extract checksums
          DARWIN_X86_SHA=$(grep "x86_64-apple-darwin" checksums.txt | awk '{print $1}')
          DARWIN_ARM_SHA=$(grep "aarch64-apple-darwin" checksums.txt | awk '{print $1}')
          LINUX_X86_SHA=$(grep "x86_64-unknown-linux-musl" checksums.txt | awk '{print $1}')
          LINUX_ARM_SHA=$(grep "aarch64-unknown-linux-musl" checksums.txt | awk '{print $1}')

          cat > homebrew-tap/Formula/quay.rb << FORMULA_EOF
          class Quay < Formula
            desc "A TUI port manager for local processes, SSH forwards, and Docker containers"
            homepage "https://github.com/shonenm/quay"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "${BASE_URL}/quay-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${DARWIN_X86_SHA}"
              else
                url "${BASE_URL}/quay-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${DARWIN_ARM_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "${BASE_URL}/quay-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              else
                url "${BASE_URL}/quay-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
            end

            def install
              bin.install "quay"
            end

            test do
              assert_match "quay", shell_output("#{bin}/quay --version")
            end
          end
          FORMULA_EOF
      - name: Commit and push formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/quay.rb
          git commit -m "quay ${{ needs.plan.outputs.version }}"
          git push

  # Upload shell installer
  publish-installer:
    needs:
      - plan
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Generate installer script
        run: |
          cat > quay-installer.sh << 'INSTALLER_EOF'
          #!/bin/sh
          set -eu

          REPO="shonenm/quay"
          BINARY_NAME="quay"

          detect_target() {
            OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m)

            case "$OS" in
              darwin)
                case "$ARCH" in
                  x86_64) echo "x86_64-apple-darwin" ;;
                  arm64|aarch64) echo "aarch64-apple-darwin" ;;
                  *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
                esac
                ;;
              linux)
                case "$ARCH" in
                  x86_64) echo "x86_64-unknown-linux-musl" ;;
                  aarch64|arm64) echo "aarch64-unknown-linux-musl" ;;
                  *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
                esac
                ;;
              *) echo "Unsupported OS: $OS" >&2; exit 1 ;;
            esac
          }

          VERSION="${QUAY_VERSION:-latest}"
          if [ "$VERSION" = "latest" ]; then
            VERSION=$(curl -sL "https://api.github.com/repos/$REPO/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          fi

          TARGET=$(detect_target)
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$VERSION/$BINARY_NAME-${VERSION#v}-$TARGET.tar.gz"

          echo "Downloading $BINARY_NAME $VERSION for $TARGET..."
          TMPDIR=$(mktemp -d)
          curl -sL "$DOWNLOAD_URL" | tar -xz -C "$TMPDIR"

          INSTALL_DIR="${QUAY_INSTALL_DIR:-$HOME/.local/bin}"
          mkdir -p "$INSTALL_DIR"
          mv "$TMPDIR/$BINARY_NAME" "$INSTALL_DIR/"
          chmod +x "$INSTALL_DIR/$BINARY_NAME"
          rm -rf "$TMPDIR"

          echo "Installed $BINARY_NAME to $INSTALL_DIR/$BINARY_NAME"
          echo ""
          echo "Make sure $INSTALL_DIR is in your PATH:"
          echo "  export PATH=\"\$PATH:$INSTALL_DIR\""
          INSTALLER_EOF
      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: quay-installer.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
